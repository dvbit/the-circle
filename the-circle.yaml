# ═══════════════════════════════════════════════════════════════════════════
# The Circle – ESPHome configuration (refactored)
# ═══════════════════════════════════════════════════════════════════════════
# This YAML replaces the monolithic lambda-based effects with the
# the_circle custom component. All visual logic is now handled by
# composable primitives configured via HA services.
#
# Ref: Requirement spec – "YAML snello" with custom component
# ═══════════════════════════════════════════════════════════════════════════

substitutions:
  i_a_n_l: "263"    # Inner Aura LED count
  o_a_n_l: "132"    # Outer Aura LED count
  i_g_n_l: "111"    # Inner Glow LED count
  alexa: "alexa_media_alexa_cucina"

esphome:
  name: the-circle
  area: Pranzo
  friendly_name: The Circle
  # Versione firmware esposta a HA come attributo del device.
  # Ref: https://esphome.io/components/esphome/ (project: name/version)
  project:
    name: "dvbit.the-circle"
    version: "1.4"

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── External component ────────────────────────────────────────────────────
# Load The Circle from local path (or git URL for distribution)
external_components:
  - source:
      type: local
      path: components
    components: [the_circle]

# ── Network ───────────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.2.172
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
  ap:
    ssid: "TheCircle AP"
    password: !secret wifi_password

captive_portal:

logger:
  level: INFO

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
    password: "toorapi"

# ── API – must enable custom_services and homeassistant_states ────────────
# Ref: https://esphome.io/components/api/
# custom_services: allows register_service() from C++
# homeassistant_states: allows subscribe_homeassistant_state() from C++
api:
  encryption:
    key: "fpH+HCqYyRJ7D14B3IEmKf9YrDrzIEhtMQ9ppbu6N14="
  custom_services: true
  homeassistant_states: true

# ── Time ──────────────────────────────────────────────────────────────────
time:
  - platform: sntp
    id: sntptime
    timezone: Europe/Rome

# ── I2C (BH1750 light sensor) ────────────────────────────────────────────
i2c:
  sda: 22
  scl: 21
  scan: true

# ── UART (LD2410 presence sensor) ────────────────────────────────────────
uart:
  id: ld2410_uart
  tx_pin: GPIO27
  rx_pin: GPIO35
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: movement
  uart_id: ld2410_uart

# ══════════════════════════════════════════════════════════════════════════
# LED Strips
# These are declared as standard ESPHome lights.
# The Circle component takes control of their buffers for rendering.
# ══════════════════════════════════════════════════════════════════════════

light:
  # ── Inner Aura (SK9822, 263 LEDs) ─────────────────────────────────────
  - platform: fastled_spi
    id: i_a
    icon: 'mdi:circle-double'
    chipset: SK9822
    data_pin: GPIO16
    clock_pin: GPIO17
    num_leds: ${i_a_n_l}
    rgb_order: BGR
    name: "Inner Aura"
    default_transition_length: 0s
    color_correct: [0.8, 0.8, 0.8]

  # ── Outer Aura (APA102, 132 LEDs) ────────────────────────────────────
  - platform: fastled_spi
    id: o_a
    icon: 'mdi:circle'
    chipset: APA102
    data_pin: GPIO19
    clock_pin: GPIO18
    num_leds: ${o_a_n_l}
    rgb_order: BGR
    name: "Outer Aura"
    default_transition_length: 0s
    color_correct: [0.6, 0.6, 0.6]

  # ── Inner Glow (SK6812 RGBW, 111 LEDs) ──────────────────────────────
  - platform: neopixelbus
    type: GRBW
    icon: 'mdi:radiobox-blank'
    pin: GPIO26
    variant: SK6812
    num_leds: ${i_g_n_l}
    name: "Inner Glow"
    id: i_g
    default_transition_length: 0s
    color_correct: [0.6, 0.6, 0.6]

# ══════════════════════════════════════════════════════════════════════════
# The Circle Component
# ══════════════════════════════════════════════════════════════════════════
the_circle:
  id: circle
  strips:
    - light_id: i_a    # Strip 0: Inner Aura, 263 LEDs
    - light_id: o_a    # Strip 1: Outer Aura, 132 LEDs
    - light_id: i_g    # Strip 2: Inner Glow, 111 LEDs
  num_profiles: 20
  layers_per_strip: 6

# ══════════════════════════════════════════════════════════════════════════
# F6: Layer Editor UI – visible in ESPHome web UI and Home Assistant
# ══════════════════════════════════════════════════════════════════════════

# ── Navigation + type selects ────────────────────────────────────────────
select:
  - platform: the_circle
    the_circle_id: circle
    # Navigation: which layer are we editing?
    edit_profile:
      name: "Edit Profile"
      icon: mdi:numeric
    edit_strip:
      name: "Edit Strip"
      icon: mdi:led-strip-variant
    edit_layer:
      name: "Edit Layer"
      icon: mdi:layers
    # Primitive type for the selected layer
    primitive_type:
      name: "Primitive Type"
      icon: mdi:shape
    # Active rendering profile
    active_profile:
      name: "Active Profile"
      icon: mdi:play-circle

# ── Editing numbers ──────────────────────────────────────────────────────
number:
  - platform: the_circle
    the_circle_id: circle
    # Primitive parameters
    param0:
      name: "Param 0"
      icon: mdi:numeric-0-box
    param1:
      name: "Param 1"
      icon: mdi:numeric-1-box
    param2:
      name: "Param 2"
      icon: mdi:numeric-2-box
    param3:
      name: "Param 3"
      icon: mdi:numeric-3-box
    # Color editing
    color_r:
      name: "Color R"
      icon: mdi:palette
    color_g:
      name: "Color G"
      icon: mdi:palette
    color_b:
      name: "Color B"
      icon: mdi:palette
    color_index:
      name: "Color Slot"
      icon: mdi:format-color-fill
    # Intensity
    intensity:
      name: "Intensity"
      icon: mdi:brightness-6
    # Entity value mapping
    value_min:
      name: "Value Min"
      icon: mdi:arrow-collapse-down
    value_max:
      name: "Value Max"
      icon: mdi:arrow-collapse-up
    # Threshold modifier
    threshold_enabled:
      name: "Threshold Enabled"
      icon: mdi:traffic-light
    threshold1:
      name: "Threshold 1"
      icon: mdi:ray-start
    threshold2:
      name: "Threshold 2"
      icon: mdi:ray-end

# ── Entity ID text input ─────────────────────────────────────────────────
text:
  - platform: the_circle
    the_circle_id: circle
    entity_id_input:
      name: "Entity ID"
      icon: mdi:link-variant
      mode: text
    profile_name:
      name: "Profile Name"
      icon: mdi:rename
      mode: text

# ══════════════════════════════════════════════════════════════════════════
# Sensors & inputs (unchanged from original)
# ══════════════════════════════════════════════════════════════════════════

# ── Buzzer ────────────────────────────────────────────────────────────────
output:
  - platform: ledc
    pin: GPIO23
    id: buzzer_output

rtttl:
  output: buzzer_output

# ── Capacitive touch ─────────────────────────────────────────────────────
esp32_touch:
  setup_mode: False

binary_sensor:
  # ── Presence ──────────────────────────────────────────────────────────
  - platform: ld2410
    ld2410_id: movement
    has_target:
      name: Presence
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target

  # ── Touch pads ────────────────────────────────────────────────────────
  - platform: esp32_touch
    name: "Touch Left"
    id: touch_left
    pin: GPIO12
    threshold: 280
  - platform: esp32_touch
    name: "Touch Right"
    id: touch_right
    pin: GPIO2
    threshold: 180
  - platform: esp32_touch
    name: "Touch OK"
    id: touch_ok
    pin: GPIO15
    threshold: 180
  - platform: esp32_touch
    name: "Touch Esc"
    id: touch_esc
    pin: GPIO27
    threshold: 300
  - platform: status
    name: Status

sensor:
  # ── Environment ───────────────────────────────────────────────────────
  - platform: bh1750
    name: "Illuminance"
    update_interval: 10s
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    name: Uptime
    id: uptime_s
    update_interval: 15s

  # ── LD2410 ────────────────────────────────────────────────────────────
  - platform: ld2410
    ld2410_id: movement
    light:
      name: light
    moving_distance:
      name: Moving Distance
    still_distance:
      name: Still Distance
    moving_energy:
      name: Move Energy
    still_energy:
      name: Still Energy
    detection_distance:
      name: Detection Distance

text_sensor:
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ssid:
      name: WiFi SSID

# ── BLE Proxy ─────────────────────────────────────────────────────────────
esp32_ble_tracker:
  scan_parameters:
    continuous: False
    active: true
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: true
